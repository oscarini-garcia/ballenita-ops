name = "ballena-ops-api"
main = "src/index.js"
compatibility_date = "2026-05-01"

# La PWA llama al Worker por su dirección de workers.dev, así que esa ruta se
# declara explícitamente. Las URL de vista previa sobran: publicarían cada
# versión en una dirección propia que nadie usa y que también atendería.
workers_dev = true
preview_urls = false

# El binding es `DB` a propósito: es el nombre con el que el Worker la busca
# (`env.DB`). No copie el que sugiere `wrangler d1 create`, que deriva del
# nombre de la base y dejaría al Worker sin encontrarla.
[[d1_databases]]
binding = "DB"
database_name = "ballena-ops"
database_id = "862d4478-3a64-4810-b12c-239c20f03507"

[vars]
# Quien habla con esta API es la app de iOS, y no pasa por el navegador: con
# `CapacitorHttp` activado la petición la hace el sistema, sin CORS de por medio.
# La web es una libreta local y no llama aquí.
#
# La lista se queda por dos motivos: `wrangler dev` contra un navegador durante
# el desarrollo, y no dejar la puerta abierta de par en par si algún día se
# recupera el acceso web. Sin coincidencia no se emiten cabeceras CORS.
ORIGENES_PERMITIDOS = "http://localhost:5173"

# Audiencia admitida del token de Apple: el identificador del paquete de la app.
# No hay Services ID porque no hay acceso con Apple en la web.
APPLE_AUD_IOS = "com.garciadoral.ballenitaops"
# Servidor de APNs: "pruebas" mientras se prueba desde Xcode, "produccion" con el
# binario de la App Store. Sin claves de APNs no se empuja nada y no pasa nada.
APNS_ENTORNO = "pruebas"

# Secretos, que NO van aquí. Se registran con `wrangler secret put`:
#   SESION_SECRETO  · clave con la que este Worker firma las sesiones
#   TOKEN_SERVICIO  · credencial de la siembra desde JSONBin (/api/importar)
#
# Y tres más, solo para la revocación al darse de baja (directriz 5.1.1(v) de
# Apple). Sin ellos la baja funciona igual —la cuenta se elimina— pero no se le
# avisa a Apple, y la app se queda en «Apps que usan tu Apple ID». Ver
# docs/APPSTORE.md §2:
#   APPLE_CLAVE_P8  · el contenido del .p8 de Sign in with Apple, tal cual
#   APPLE_CLAVE_ID  · el Key ID de esa clave (10 caracteres)
#   APPLE_EQUIPO    · el Team ID de la cuenta de desarrollador (10 caracteres)
#   APNS_CLAVE_P8   · contenido del fichero .p8 de la clave de APNs
#   APNS_CLAVE_ID   · identificador de esa clave (Key ID)

[observability]
enabled = true
