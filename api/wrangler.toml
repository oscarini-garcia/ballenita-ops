name = "ballena-ops-api"
main = "src/index.js"
compatibility_date = "2026-05-01"

# La PWA llama al Worker por su dirección de workers.dev, así que esa ruta se
# declara explícitamente. Las URL de vista previa sobran: publicarían cada
# versión en una dirección propia que nadie usa y que también atendería.
workers_dev = true
preview_urls = false

# El binding es `DB` a propósito: es el nombre con el que el Worker la busca
# (`env.DB`). No copie el que sugiere `wrangler d1 create`, que deriva del
# nombre de la base y dejaría al Worker sin encontrarla.
[[d1_databases]]
binding = "DB"
database_name = "ballena-ops"
database_id = "PENDIENTE — pega aquí el id que devuelve `wrangler d1 create ballena-ops`"

[vars]
# Orígenes desde los que se admite la PWA. Sin coincidencia no se emiten
# cabeceras CORS, de modo que una web ajena no puede hablar con esta API.
# Mientras dure el traslado a Cloudflare Pages conviene dejar los dos.
ORIGENES_PERMITIDOS = "https://ballenita-ops.pages.dev,https://oscarini-garcia.github.io,http://localhost:5173"

# Audiencias admitidas del token de Apple: el Services ID de la web y el
# identificador del paquete de la app de iOS.
APPLE_AUD_WEB = "com.oscarini.ballenaops.web"
APPLE_AUD_IOS = "com.oscarini.ballenaops"

# Secretos, que NO van aquí. Se registran con `wrangler secret put`:
#   SESION_SECRETO  · clave con la que este Worker firma las sesiones
#   TOKEN_SERVICIO  · credencial de la siembra desde JSONBin (/api/importar)

[observability]
enabled = true
