name = "ballena-ops-api"
main = "src/index.js"
compatibility_date = "2026-05-01"

# La PWA llama al Worker por su dirección de workers.dev, así que esa ruta se
# declara explícitamente. Las URL de vista previa sobran: publicarían cada
# versión en una dirección propia que nadie usa y que también atendería.
workers_dev = true
preview_urls = false

# El binding es `DB` a propósito: es el nombre con el que el Worker la busca
# (`env.DB`). No copie el que sugiere `wrangler d1 create`, que deriva del
# nombre de la base y dejaría al Worker sin encontrarla.
[[d1_databases]]
binding = "DB"
database_name = "ballena-ops"
database_id = "862d4478-3a64-4810-b12c-239c20f03507"

[vars]
# Quien habla con esta API es la app de iOS —que no pasa por el navegador: con
# `CapacitorHttp` activado la petición la hace el sistema, sin CORS de por
# medio— **y ahora también la web**, que desde el enlace de acceso (SPECS
# §14.52) ya no es solo una libreta local.
#
# Esa parte sí pasa por CORS de verdad, así que el dominio de Pages tiene que
# estar aquí: sin él, el navegador tira todas las peticiones y lo que se ve es
# un enlace que no entra sin decir por qué. `localhost` se queda para
# `wrangler dev` contra un navegador durante el desarrollo. Sin coincidencia no
# se emiten cabeceras CORS.
ORIGENES_PERMITIDOS = "https://ballenita-ops.galoopa.store,http://localhost:5173"

# Audiencia admitida del token de Apple: el identificador del paquete de la app.
# No hay Services ID porque no hay acceso con Apple en la web.
APPLE_AUD_IOS = "com.garciadoral.ballenitaops"
# Servidor de APNs. **TestFlight y la App Store firman `production`**, y desde
# que la app se instala por ahí este es el valor bueno; "pruebas" solo vale para
# un binario puesto a mano desde Xcode, que firma `development`.
#
# Cruzarlos no es un fallo cualquiera: Apple contesta `BadDeviceToken`, que es lo
# mismo que contesta un token muerto. Hasta ahora eso **borraba el registro del
# teléfono** — mismo síntoma que una desinstalación, causa distinta y ninguna
# pista. `apns.js` lo reintenta ya contra el otro servidor antes de darlo por
# muerto, así que un desajuste aquí cuesta una petición de más, no los avisos de
# todo el grupo. Sin claves de APNs no se empuja nada y no pasa nada.
APNS_ENTORNO = "produccion"

# Secretos, que NO van aquí. Se registran con `wrangler secret put`:
#   SESION_SECRETO  · clave con la que este Worker firma las sesiones
#   TOKEN_SERVICIO  · credencial de la siembra desde JSONBin (/api/importar)
#
# Y tres más, solo para la revocación al darse de baja (directriz 5.1.1(v) de
# Apple). Sin ellos la baja funciona igual —la cuenta se elimina— pero no se le
# avisa a Apple, y la app se queda en «Apps que usan tu Apple ID». Ver
# docs/APPSTORE.md §2:
#   APPLE_CLAVE_P8  · el contenido del .p8 de Sign in with Apple, tal cual
#   APPLE_CLAVE_ID  · el Key ID de esa clave (10 caracteres)
#   APPLE_EQUIPO    · el Team ID de la cuenta de desarrollador (10 caracteres)
#   APNS_CLAVE_P8   · contenido del fichero .p8 de la clave de APNs
#   APNS_CLAVE_ID   · identificador de esa clave (Key ID)

# El reloj del Worker (SPECS §14.73). Es lo primero de esta app que se dispara
# solo: todo lo demás sale de que alguien toque algo desde un móvil.
#
# Cada cinco minutos, y no cada minuto: el aviso puede salir hasta cinco tarde
# —entre 60 y 55 minutos antes—, que para «dentro de una hora» no se nota, y son
# 288 ejecuciones al día sobre un tope gratuito de 100.000.
#
# La ventana que mira es «ya entra en la última hora y todavía no ha pasado», no
# «faltan exactamente sesenta»: así una pasada perdida —un despliegue, un pico—
# la recoge la siguiente en vez de saltarse el aviso para siempre.
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
