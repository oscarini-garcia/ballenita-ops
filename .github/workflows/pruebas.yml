name: pruebas

# El despliegue de la web ya no vive aquí: Cloudflare Pages construye y publica
# solo en cada empujón a main (docs/DESPLIEGUE.md §4). Lo que sí tiene que
# ocurrir en cada rama es esto: que las dos piezas —la PWA y el Worker— pasen
# sus pruebas.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Comprobar que el build sale
        run: npm run build

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      # Las pruebas del Worker corren contra el esquema de verdad usando
      # `node:sqlite`, que necesita Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
