<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aquí no hay nada · Ballena Ops</title>
<!--
  Existe sobre todo por una razón práctica: sin él, Cloudflare Pages responde
  200 con el index.html de la aplicación para CUALQUIER ruta que no exista. Eso
  convierte la comprobación del fichero de verificación de Apple en un falso
  positivo redondo —parece publicado cuando no lo está— y la verificación falla
  después con un error que no explica nada. Ver docs/DESPLIEGUE.md §4.4.

  La app no tiene rutas: las pestañas son estado, no URL. Así que aquí solo se
  llega escribiendo una dirección a mano.
-->
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; text-align: center;
    padding: 24px; background: #08202c; color: #eaf6fb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .b { font-size: 64px; line-height: 1; }
  h1 { font-size: 22px; font-weight: 850; margin: 16px 0 8px; }
  p { color: #a9cede; font-size: 14.5px; line-height: 1.5; margin: 0 0 20px; }
  a { display: inline-block; background: #1fa6d6; color: #fff; text-decoration: none;
    font-weight: 750; padding: 12px 18px; border-radius: 7px; }
</style>
</head>
<body>
  <div>
    <div class="b">🐳</div>
    <h1>Por aquí no pasa la ballena</h1>
    <p>Esta dirección no lleva a ninguna parte.</p>
    <a href="/">Volver a Ballena Ops</a>
  </div>
</body>
</html>
